[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.build.hooks.vcs]
version-file = "src/dumpty/_version.py"

[tool.semantic_release]
commit_parser = "conventional"
commit_message = "chore(release): {version} [skip ci]"
major_on_zero = false
tag_format = "v{version}"
version_source = "tag"

[tool.semantic_release.changelog]
mode = "update"
default_templates = { changelog_file = "CHANGELOG.adoc" }
exclude_commit_patterns = [
  '''chore(?:\([^)]*?\))?: .+''',
  '''ci(?:\([^)]*?\))?: .+''',
  '''refactor(?:\([^)]*?\))?: .+''',
  '''style(?:\([^)]*?\))?: .+''',
  '''test(?:\([^)]*?\))?: .+''',
  '''build\((?!deps\): .+)''',
  '''Merged? .*''',
]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.development]
match = "development"
prerelease = true

[tool.semantic_release.branches."v*"]
match = "^v\\d+\\.\\d+$"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.coverage.paths]
source = ["src/"]
tests = ["src/"]

[tool.coverage.run]
branch = true
source = ["src/"]
omit = [
    ".venv/*",
    "*/test*",
    "*/conftest.py",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "N", "S", "TID", "W"]
ignore = [
    "E203",   # whitespace before ':'
    "E501",   # line too long (handled by line-length)
    "C901",   # too complex
    "S608",   # possible SQL injection
    "S311",   # random generators for cryptographic purposes
    "N802",   # function name should be lowercase
    "TID251", # banned-api (we don't want to ban specific APIs)
    "TID253", # banned-module-level-imports (we don't want to ban module imports)
    "D301",   # use r""" if any backslashes in docstring (conflicts with Click \b formatting)
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "N806", "S106"]
"tests/*" = ["S101", "N806", "S106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_calls = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests/"]
addopts = "--cov-fail-under=20"
timeout = 90
python_files = ["test_*.py"]
python_functions = ["test_*"]
norecursedirs = [
    "*.egg-info",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".vscode",
]

[project]
name = "dumpty"
dynamic = ["version"]
description = "Incremental backup utility for a popular reporting database"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = ["database"]
authors = [
  {name = "Joseph Mesterhazy", email = "jmesterh@gmail.com"},
]
maintainers = [
  {name = "RT OSS Admin", email = "rit-oss-admin@stanford.edu"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Database",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "PyYAML>=6.0.3",
  "pyaml>=26.2.1",
  "pyspark>=4.1.1",
  "tomli>=2.4.0",
  "Jinja2>=3.1.6",
  "dataclass-wizard>=0.39.1",
  "google-cloud-bigquery>=3.40.1",
  "google-cloud-storage>=3.9.0",
  "SQLAlchemy>=2.0",
  "pysparkextra>=0.4.2",
  "alive-progress>=3.3.0",
  "psutil>=7.2.2",
  "tenacity>=9.1.4",
  "tinydb>=4.8.2",
  "tinydb-serialization>=2.2.0",
  "pyodbc>=5.3.0",
  "funcy>=2.0",
]

[project.urls]
Homepage = "https://github.com/stanfordmed/dumpty"
"Bug Reports" = "https://github.com/stanfordmed/dumpty/issues"
Source = "https://github.com/stanfordmed/dumpty"

[project.scripts]
dumpty = "dumpty.main:main"

[dependency-groups]
dev = [
    "coverage[toml]",
    "mypy",
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-timeout>=2.3.1",
    "python-semantic-release>=10.5.3",
]
